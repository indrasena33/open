<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Display Page</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #f4f4f9; overflow: hidden; }
        #container { width: 100%; height: 100vh; display: flex; justify-content: center; align-items: center; }
        iframe { width: 100%; height: 100%; border: none; }
        .welcome { font-family: sans-serif; color: #555; text-align: center; }
    </style>
</head>
<body>

    <div id="container">
        <div class="welcome">
            <h2>Content is coming soon...</h2>
            <p>Let admin post it.</p>
        </div>
    </div>

    <script>
        const RENDER_API_URL = 'https://open-jad2.onrender.com/api/content';
        let lastHtmlContent = localStorage.getItem('cached_live_content') || "";

        if (lastHtmlContent) {
            renderContent(lastHtmlContent);
        }

        function renderContent(htmlContent) {
            const container = document.getElementById('container');
            if (container.querySelector('iframe') && container.dataset.rendered === htmlContent) return;
            
            container.dataset.rendered = htmlContent;
            container.innerHTML = `<iframe sandbox="allow-scripts allow-popups"></iframe>`;
            const iframe = container.querySelector('iframe');
            iframe.srcdoc = htmlContent;
        }

        async function loadLatestContent() {
            try {
                const response = await fetch(RENDER_API_URL);
                if (!response.ok) throw new Error(`Status: ${response.status}`);
                const data = await response.json();
                const htmlContent = data.html;
                
                if (htmlContent && htmlContent !== lastHtmlContent) {
                    lastHtmlContent = htmlContent;
                    localStorage.setItem('cached_live_content', htmlContent);
                    renderContent(htmlContent);
                }
            } catch (error) {
                console.error("Error loading content:", error);
            }
        }

        loadLatestContent();
        setInterval(loadLatestContent, 10000);
    </script>
</body>
</html>
