<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Display Page</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #f4f4f9; overflow: hidden; }
        #container { width: 100%; height: 100vh; display: flex; justify-content: center; align-items: center; }
        iframe { width: 100%; height: 100%; border: none; }
        .welcome { font-family: sans-serif; color: #555; text-align: center; }
    </style>
</head>
<body>

    <div id="container">
        <div class="welcome">
            <h2>Waiting for content...</h2>
            <p>Upload files or content through your admin panel.</p>
        </div>
    </div>

    <script>
        // MUST BE your active backend URL, not myspace-rlak.onrender.com
        const RENDER_API_URL = 'https://open-jad2.onrender.com/api/content';
        let lastHtmlContent = "";

        async function loadLatestContent() {
            try {
                const response = await fetch(RENDER_API_URL);
                if (!response.ok) {
                    throw new Error(`Server responded with status: ${response.status}`);
                }
                const data = await response.json();
                const htmlContent = data.html;
                
                if (htmlContent && htmlContent !== lastHtmlContent) {
                    lastHtmlContent = htmlContent;
                    const container = document.getElementById('container');
                    
                    container.innerHTML = `<iframe sandbox="allow-scripts allow-same-origin allow-popups"></iframe>`;
                    const iframe = container.querySelector('iframe');
                    iframe.srcdoc = htmlContent;
                }
            } catch (error) {
                console.error("Error loading content:", error);
            }
        }

        loadLatestContent();
        setInterval(loadLatestContent, 5000);
    </script>
</body>
</html>
